components:
  schemas:
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        country:
          type: string
          maxLength: 80
        description:
          type: string
        logo:
          type: string
          maxLength: 255
        is_popular:
          type: boolean
        isPopular:
          type: boolean
          readOnly: true
        product_count:
          type: integer
          readOnly: true
        productCount:
          type: integer
          readOnly: true
      required:
      - id
      - isPopular
      - name
      - productCount
      - product_count
      - slug
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        subtotal:
          type: number
          format: double
          readOnly: true
        totalItems:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - subtotal
      - totalItems
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/CartItemProductMini'
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        lineTotal:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - lineTotal
      - product
      - updated_at
    CartItemAddRequestRequest:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
          description: Product UUID, slug, or legacy ID
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - productId
    CartItemProductMini:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        legacy_id:
          type: string
          nullable: true
          maxLength: 64
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        sku:
          type: string
          maxLength: 100
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        original_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        image:
          type: string
          maxLength: 255
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        in_stock:
          type: boolean
      required:
      - id
      - name
      - price
      - sku
      - slug
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        icon_name:
          type: string
          maxLength: 64
        iconName:
          type: string
          readOnly: true
        featured_image:
