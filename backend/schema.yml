          maxLength: 255
        featuredImage:
          type: string
          readOnly: true
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        product_count:
          type: integer
          readOnly: true
        productCount:
          type: integer
          readOnly: true
